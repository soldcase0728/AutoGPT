services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olsm
      POSTGRES_PASSWORD: olsm
      POSTGRES_DB: olsm_facilities
    ports:
      - "5432:5432"
    volumes:
      - olsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olsm -d olsm_facilities"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  olsm_pgdata:
