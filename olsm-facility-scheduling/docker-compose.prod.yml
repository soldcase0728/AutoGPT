# One command to run the whole thing on any machine with Docker:
#
#   SESSION_SECRET=$(openssl rand -base64 32) \
#   POSTGRES_PASSWORD=$(openssl rand -base64 24) \
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Then open http://localhost:3000 and sign in with a seeded account.
#
# This is a self-hosted pilot setup, not a hardened production deployment:
# Postgres is reachable only inside the compose network and there is no TLS.
# Put it behind a reverse proxy before anyone outside the school network uses
# it.
#
# NOTE ON QUOTING: every value below is quoted. Values here routinely contain
# ":" (connection strings, times) and an unquoted colon-space is parsed by YAML
# as a nested key, which fails with a "mapping values are not allowed" error
# that points at a column rather than the real cause.

name: olsm-facilities

services:
  postgres:
    image: "postgres:16-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "olsm_app"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-in-production}"
      POSTGRES_DB: "olsm_facilities"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olsm_app -d olsm_facilities"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # "postgres" is the compose service name, not localhost.
      DATABASE_URL: "postgresql://olsm_app:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/olsm_facilities?schema=public"
      # Required, and deliberately NOT declared with the "?" required-variable
      # syntax. That syntax fails interpolation for *every* compose subcommand,
      # so `ps`, `logs` and `down` all refuse to run unless the secret happens
      # to be exported in that shell -- which is exactly when you need `logs`.
      # The entrypoint validates this instead, and refuses to start without at
      # least 32 characters. Put it in .env; see DEPLOY.md.
      SESSION_SECRET: "${SESSION_SECRET:-}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      # This route runs on a machine you control, commonly over plain http on
      # the school network. The https/loopback guard is for hosted services.
      ALLOW_INSECURE_APP_URL: "1"
      TZ: "${TZ:-America/Detroit}"

      # Loads a week of sample bookings so a fresh instance is worth clicking.
      # Set to 0 once real data goes in.
      LOAD_DEMO_DATA: "${LOAD_DEMO_DATA:-1}"

      # Integrations stay inert until real credentials are supplied. The app
      # runs fully without them; email and SMS log to the container output.
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-console}"
      SMS_PROVIDER: "${SMS_PROVIDER:-console}"
      ESIGN_PROVIDER: "${ESIGN_PROVIDER:-manual}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
      JOB_RUNNER_TOKEN: "${JOB_RUNNER_TOKEN:-change-me}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Scheduled work: drains the outbound queue and releases expired holds.
  # Without this, reminders never send and holds never expire.
  cron:
    image: "curlimages/curl:8.11.1"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      JOB_RUNNER_TOKEN: "${JOB_RUNNER_TOKEN:-change-me}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $${JOB_RUNNER_TOKEN}" http://app:3000/api/jobs/process-queue > /dev/null || true
          curl -fsS -X POST -H "Authorization: Bearer $${JOB_RUNNER_TOKEN}" http://app:3000/api/jobs/expire-holds > /dev/null || true
          sleep 300
        done

volumes:
  pgdata:
