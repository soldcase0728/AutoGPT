# ---------------------------------------------------------------------
# Priority scoring
# ---------------------------------------------------------------------
# A transparent additive score. Every component that fires is written to
# the "Priority score explanation" column so a reviewer can audit it.
#
# A HIGH SCORE MEANS "LOOK AT THIS EARLY". It does not indicate
# malpractice, liability, or any legal conclusion.
priority:
  # Points per issue tag present on the document.
  tag_points:
    STATUTE_OF_FRAUDS: 12
    PLEADING_AND_WAIVER: 10
    JOHN_WILSON: 8
    PATRICK_RODE: 6
    EXPERT_FAILURE: 8
    DAMAGES: 6
    CLIENT_FILE: 7
    INSURANCE: 5
    APPEAL: 7
    BANKRUPTCY: 4

  # Awarded once when the document carries at least N distinct tags.
  multi_tag_bonus:
    threshold: 3
    points: 8

  # Awarded when a named person appears in an email header (From/To/Cc)
  # rather than merely being mentioned in body text.
  participant_points:
    john_wilson: 10
    patrick_rode: 6
  participant_patterns:
    john_wilson: ["john\\s+j?\\.?\\s*wilson", "\\bjwilson\\b"]
    patrick_rode: ["patrick\\s+rode", "\\bpat\\s+rode\\b", "\\bprode\\b"]

  # Awarded when the document is not part of any duplicate group.
  unique_content_points: 5

  # Deducted when the document is a non-primary member of an exact
  # duplicate group (review the primary instead).
  duplicate_penalty: -8

  # Documents dated within `window_days` of any date below get a bump.
  # Dates are ISO (YYYY-MM-DD). Leave the list empty until real event
  # dates are known - do not invent them.
  key_event_dates: []
  key_event_window_days: 14
  key_event_points: 6

  # Documents flagged for manual review get a small bump so they surface.
  manual_review_points: 3

  # Score at or above which a document enters 15_Priority_Review_Queue.
  queue_threshold: 20
  # Maximum rows written to each review queue workbook. 0 = unlimited.
  queue_max_rows: 5000

# ---------------------------------------------------------------------
# Quality-control sampling (see README "Quality control")
# ---------------------------------------------------------------------
qc:
  # Deterministic seed so a QC sample can be reproduced exactly.
  random_seed: 20240101
  pilot_sample_size: 200
  full_run_sample:
    high_priority: 50
    low_priority: 50
    ocr: 25
    blank_candidates: 25
    family_inferences: 25
    near_duplicates: 25

# ---------------------------------------------------------------------
# Reporting
# ---------------------------------------------------------------------
reports:
  # Add clickable file:// hyperlinks to source PDFs in Excel outputs.
  hyperlinks: true
  # Excel hard-caps a worksheet at 1,048,576 rows; stay under it.
  max_rows_per_sheet: 1000000
  freeze_header: true
  autofilter: true
  max_column_width: 60
  # Never widen these; they hold locators, not content.
  wrap_text_columns: ["Issue tags", "Priority score explanation", "Processing notes"]

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging:
  level: "INFO"
  # Console never receives document text; only counts, names, and stats.
  console_level: "INFO"
  file_level: "DEBUG"
  max_bytes: 20971520
  backup_count: 10
  # Hard safety switch. When true (default) the logging layer refuses to
  # emit any record carrying an extracted-text payload.
  redact_document_text: true
