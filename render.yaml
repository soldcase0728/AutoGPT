# Render blueprint -- the shortest path to a URL you can send someone.
#
#   1. Render dashboard -> New -> Blueprint -> pick this repo.
#   2. Choose the branch this app lives on.
#   3. Apply.
#
# This file has to sit at the REPOSITORY ROOT: Render only looks for
# render.yaml here, not in subdirectories. The app itself lives one level down,
# which is what `rootDir` below points at -- every path in a service block is
# resolved relative to that, so dockerfilePath and dockerContext stay simple.
#
# Render provisions the database, generates SESSION_SECRET and JOB_RUNNER_TOKEN,
# runs the migrations on boot and gives you an HTTPS URL.
#
# After the first deploy, set APP_URL on both services to the URL Render
# assigned, then redeploy once so links in emails point somewhere real.
#
# Costs: the web service is on `starter` (a few dollars a month) rather than
# free, because free web services sleep when idle and a scheduling system that
# takes thirty seconds to wake up will not be used. The database is on the free
# tier, which EXPIRES AFTER 30 DAYS -- fine for a pilot, not fine for real
# bookings. Move it to a paid tier before anyone depends on it.

services:
  - type: web
    name: olsm-facilities
    runtime: docker
    rootDir: olsm-facility-scheduling
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: olsm-facilities-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JOB_RUNNER_TOKEN
        generateValue: true
      - key: APP_URL
        sync: false # set to the URL Render assigns, after the first deploy
      - key: TZ
        value: America/Detroit
      # A week of sample bookings so the instance is worth clicking through.
      # Set to 0 before real data goes in.
      - key: LOAD_DEMO_DATA
        value: "1"
      - key: EMAIL_PROVIDER
        value: console
      - key: SMS_PROVIDER
        value: console
      - key: ESIGN_PROVIDER
        value: manual
      - key: STORAGE_PROVIDER
        value: local

  # Background work. Without these, reminders never send and expired holds
  # never release their slots.
  - type: cron
    name: olsm-process-queue
    runtime: docker
    rootDir: olsm-facility-scheduling
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "*/5 * * * *"
    dockerCommand: >
      sh -c "wget -q -O- --post-data='' --header=\"Authorization: Bearer $JOB_RUNNER_TOKEN\" $APP_URL/api/jobs/process-queue"
    envVars:
      - key: JOB_RUNNER_TOKEN
        fromService:
          name: olsm-facilities
          type: web
          envVarKey: JOB_RUNNER_TOKEN
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: olsm-facilities-db
          property: connectionString
      - key: SESSION_SECRET
        fromService:
          name: olsm-facilities
          type: web
          envVarKey: SESSION_SECRET

databases:
  - name: olsm-facilities-db
    databaseName: olsm_facilities
    user: olsm_app
    plan: free
